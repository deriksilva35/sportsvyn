name: tests

# THE FULL SUITE, on every PR and every push to main (CLAUDE.md: "the suite is
# the whole suite"). No touched-dir shortcut: the run is node --test over every
# tracked *.test.mjs, same command as the droplet gate.
#
# DATABASE: secrets.CI_DATABASE_URL is a DEDICATED Neon branch named "ci".
# NEVER DEV, NEVER PROD. The DB tests write and tear down real rows, so two runs
# must never share the branch at once. TWO THINGS SERIALIZE THEM (mon-5, 26 Oct):
# there is ONE self-hosted runner, and GitHub queues jobs for it without
# cancelling; and the suite step holds /run/lock/sportsvyn-suite/suite.lock
# (flock, waits up to 60 min), shared with the droplet's own suite runs.
# THERE IS NO SHARED CONCURRENCY GROUP ANY MORE. The old `ci-db` group allowed
# one pending run and cancelled every older pending one, so on 26 Oct #56 was
# bumped three times by other PRs and pushes. Now each PR has its own group
# (ci-pr-<number>), so only a NEWER push to the SAME PR cancels its older run;
# a push to main gets a group per commit and is never cancelled.
#
# ENV VARS the tests and the code they import read (grep of process.env across
# the *.test.mjs files; each maps to a secret of the same name). Many are set by
# the tests themselves; they are passed through only so a test that reads one it
# does not set sees the same shape as on the droplet. An unset secret arrives as
# an empty string, which every reader here treats as missing.
#   DATABASE_URL        <- CI_DATABASE_URL (the "ci" Neon branch; the one required var)
#   CFBD_API_KEY        cfbd client tests (dummy value is enough, no network)
#   ODDS_API_KEY        lib/theOddsApi.test.mjs
#   AUTH_SECRET         auth / admin tests
#   EMAIL_LINK_SECRET   lib/email/linkSecret.test.mjs, welcome email
#   ADMIN_USERNAME      lib/admin/requireAdmin.test.mjs
#   ADMIN_SECRET        lib/admin tests
#   CRON_SECRET         lib/pollers/cronAuth.test.mjs
#   NEXT_PUBLIC_BASE_URL  link-building tests
#   RESEND_API_KEY      email senders imported by draft/sim component tests
#   API_SPORTS_KEY      app/nfl/game/liveFallback.test.mjs
# Tests do NOT need PROD_DATABASE_URL: the ones that mention it either refuse
# to run when DATABASE_URL equals it (it is unset here) or only assert on
# source text. lib/fantasy/collegeSurface.test.mjs falls back to DATABASE_URL
# and passes vacuously if the ci branch holds no Fantrax draft_config.
#
# DOCS-ONLY CHANGES SKIP THE SUITE (thu-3). The "changes" job lists the changed
# files (a PR: the PR's files against its base; a push: the compare from the
# previous commit). DOCS are docs/**, crew/agents/** (the SOULs),
# crew/project.yaml, crew/NOTES.md and *.md at the repo root; anything else -
# crew/bin/** and crew/lib/** included - is code. With no code
# changed, the suite job keeps its exact name (the required check) but runs on
# ubuntu-latest with one step that prints "skipped: docs-only" and exits 0: no
# setup, no suite lock, no runner queue. A workflow-level paths-ignore is NOT
# used: it would leave a docs-only PR with no check at all, so unmergeable.
# Any doubt (API error, no previous commit, an empty list) counts as code.
#
# ANY FILE A TEST READS IS CODE FOR CI'S PURPOSES, regardless of extension or
# folder (fri-2). The `{ found = 1; next }` lines are those files; they come
# before the docs rules because the first match wins. The receipt: thu-4 changed
# crew/README.md, which crew.test.mjs pins, as docs-only, and main went red with
# nobody told. lib/testing/ciDocsOnly.test.mjs scans the tests for the files they
# read and fails if this filter would call any of them docs.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - name: Code changed outside the docs?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || files=''
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # compare lists at most 300 files; a longer list is treated as code.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq 'if (.files | length) >= 300 then "TOO-MANY" else .files[].filename end') || files=''
          else
            files=''
          fi
          echo "$files" | sed 's/^/  /'
          code=true
          if [ -n "$files" ] && ! echo "$files" | grep -qx 'TOO-MANY'; then
            code=$(echo "$files" | awk '
              $0 == "crew/README.md" { found = 1; next }
              $0 == "docs/crew/data-queue.md" { found = 1; next }
              $0 == "docs/crew/sportsvyn-stats" { found = 1; next }
              $0 == "docs/design/daily-full-mock-v3.html" { found = 1; next }
              $0 == "docs/email/arcade-2026-10-15.html" { found = 1; next }
              $0 == "docs/email/arcade-2026-10-15.txt" { found = 1; next }
              $0 == "docs/email/kickoff-sep9.html" { found = 1; next }
              $0 == "docs/email/launch-email-sep8.html" { found = 1; next }
              /^docs\// { next }
              /^crew\/agents\// { next }
              $0 == "crew/project.yaml" { next }
              $0 == "crew/NOTES.md" { next }
              /^[^\/]+\.md$/ { next }
              { found = 1 }
              END { print found ? "true" : "false" }')
          fi
          echo "code_changed=$code"
          echo "code_changed=$code" >> "$GITHUB_OUTPUT"

  tests:
    name: SPORTSVŶN test suite
    needs: changes
    # Code: the self-hosted runner (one; jobs wait for it, never cancelled). Docs
    # only: a hosted runner, so it never waits behind a suite run.
    runs-on: ${{ needs.changes.outputs.code_changed == 'true' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    # 90 = up to 60 min waiting on suite.lock plus the ~15 min suite and setup.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - name: Docs only
        if: needs.changes.outputs.code_changed != 'true'
        run: |
          echo "skipped: docs-only"

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          fetch-depth: 0

      # NO CI BRANCH YET -> SKIP, GREEN (wed-2). Until the crew creates the "ci"
      # Neon branch and sets secrets.CI_DATABASE_URL, every push failed here and
      # emailed a failure. With the secret unset the job now says so and passes;
      # the moment it is set, the full suite runs again with no edit to this file.
      # A URL that IS set but points at DEV or PROD still fails hard.
      - name: The database is the "ci" branch, never DEV or PROD
        id: db
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          host=$(node -e "try{console.log(new URL(process.env.DATABASE_URL).host)}catch{console.log('')}")
          if [ -z "$host" ]; then
            echo "::notice title=tests skipped::CI_DATABASE_URL is not set - the suite needs the dedicated 'ci' Neon branch. Skipping (exit 0) until it exists; the droplet gate (scripts/suite.sh) still runs before every merge."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$host" in
            ep-rough-mouse-*|ep-winter-dawn-*) echo "refusing: CI_DATABASE_URL points at DEV or PROD ($host)"; exit 1;;
          esac
          echo "database host: $host"

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code_changed == 'true' && steps.db.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: needs.changes.outputs.code_changed == 'true' && steps.db.outputs.skip != 'true'
        run: npm ci

      - name: Full suite
        if: needs.changes.outputs.code_changed == 'true' && steps.db.outputs.skip != 'true'
        run: umask 002; flock -w 3600 /run/lock/sportsvyn-suite/suite.lock node --test $(git ls-files '*.test.mjs')
