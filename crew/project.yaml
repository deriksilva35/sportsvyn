# SPORTSVŶN crew · v1.5.3 · Oct 22 2026
project: sportsvyn
repo: https://github.com/deriksilva35/sportsvyn
default_branch: main
crew_home: crewos-droplet (OpenClaw)
project_host: considered-cc; crew runs as Linux user crew-sportsvyn (own clone, ~/crew/{bin,worktrees,secrets,data})
ssh_aliases:
  watcher: sportsvyn-droplet      # forced command, ~/crew/bin scripts only
  data_keeper: sportsvyn-droplet  # forced command `data-keeper` (dry run only)
  fixer: sportsvyn-fixer          # worktrees under ~/crew/worktrees, relay-sandbox for tests
models:
  watcher: claude-haiku-5-5
  data_keeper: claude-haiku-5-5
  fixer: claude-sonnet-5-5        # Claude Code subscription
test_command: scripts/suite.sh (full suite ~13 min; CI only for the Fixer)
fixer_tests: fast subset per docs/crew/fast-subset.md, max 2 runs per session; full suite = required CI check "SPORTSVŶN test suite"
lock_path: /run/lock/sportsvyn-suite/suite.lock
preview_url: per-branch Vercel preview (DEV DB, behind Vercel login)
error_source: app_errors table (poller, daily-tick, mlb-advance) + Vercel runtime errors via ~/crew/bin/vercel-errors
droplet_scripts: ~/crew/bin/{app-errors,vercel-errors,retention-status,provider-health,cost-watch,latest-deploy,board-state,data-keeper}; source in repo crew/bin/
script_contract: no caller args except those listed; read-only unless named; never print a secret; exit 0 ok / 1 regression / 2 setup error; last line = one SUMMARY line; <=10 s except data-keeper
secrets: ~/crew/secrets/{crew-reader.env (CREW_READER_URL), vercel.token (project-scoped)} (chmod 700, filled by CrewOS)
vercel_project_id: prj_dnWLrT1wn34YScbMwQgtGT3WYVoE  # hardcoded in latest-deploy and vercel-errors
dns: GoDaddy (ns75/ns76.domaincontrol.com); no Cloudflare zone, so no cf-top; edge/bot traffic is Vercel-only for now
start_gates:
  watcher_nightly: 06:00 PT; $0.75/run; 30/month
  watcher_board: two open-board checks a day plus pre-lock, max 4/day, 120/month
  watcher_board_open: 09:00 and 15:00 PT while a board is open
  watcher_prelock: a run when a board locks within 120 min (max one per 30 min per lock); 2 pre-lock/day
  watcher_quiet: 21:00-06:00 PT
  watcher_board_poll: CrewOS poller checks board state every 10 min
  watcher_deploy: deploy-triggered; 30/month; detected by the 10-minute poller
  watcher_trigger_runs: 150/month (120 board + 30 deploy) at $0.08/run; monthly cap $35; 10 min/run; 5 runs/day
  data_keeper: 02:00 PT; $0.30/run; 30/month; $10/month; 15 min/run; 1/day
  fixer: subscription ($0); 25 min/session; 3/day
soul_refs:
  watcher: 03f76e22  # v1.5.7, installed
  data_keeper: 263995f7
  fixer: 263995f7
db_role: crew_reader (SELECT on crew_stats views only)
watch_rules: crew/watch-rules.md  # installed into the Watcher workspace at docs/crew/watch-rules.md; GAME G1-G5, PROVIDER P1-P8, COST C1-C3
script_rulings:  # CrewOS answers, Oct 21 2026
  retention: 30 days for app_errors, push_sends, daily_guest_runs, sessions (documented rule). No pruner yet, so retention-status reports overdue counts with status=ok (informational, exit 0). One hand-filed ticket "retention pruner needed" covers it.
  cost: cost-watch budget = the real Vercel plan line item (vercel_usd_month, set by Derik); neon prints "-" (Neon bills hours, not $). pace=over only when the Vercel figure is known.
  providers: first-guess staleness thresholds stand. injuries (the wire cron, retired 29 Sep) is no longer listed (mon-5).
  data_keeper: colour-source disagreement detection is out of scope for month one (noted in data-queue.md).
crew_stats_views_prod: [app_errors_v, boards_v, retention_ages_v, provider_freshness_v]  # no PII; applied via scripts/crew-reader-grants.mjs --prod --apply
data_queue: docs/crew/data-queue.md
where_things_go:
  crew_tickets: problems (Watcher findings, Data Keeper exit 1/2, Fixer ticket status)
  runs.summary: every run's numbers, SUMMARY lines read, cap/partial notes, CREW-LOG line (Watcher, Data Keeper)
  deliverables: Data Keeper dry runs, status = waiting (counts, 10 sample rows, dry-run path, exact apply_command)
  approvals: "Derik's decision. MONTH ONE: Approve = Derik runs apply_command by hand; no auto-replay"
  docs/CREW-LOG.md: Fixer only, inside its PR
drive_folder: CrewOS/crews/sportsvyn
budgets:
  monthly_usd: 45
  per_agent: { watcher: 35, data_keeper: 10, fixer: 0 }
  per_run: { watcher_board: 0.08, watcher_deploy: 0.08, watcher_nightly: 0.75, data_keeper: 0.30 }
  runs_per_month: { watcher_board: 120, watcher_deploy: 30, watcher_nightly: 30, data_keeper: 30 }
  # closes: 120*0.08 + 30*0.08 + 30*0.75 = 34.50 <= 35; 30*0.30 = 9 <= 10
fixer_limits: { minutes: 25, subset_runs: 2, local_full_suite_runs: 0, ci_followups: 1 }
fixer_paths: see fixer/SOUL.md (allow / never lists, v1.5.1; never-list includes crew/**)
ask_first: [merge, deploy, delete, send, backfill, testflight, prod_write, firewall, migration]
rung: { fixer: "2 (PR only, Derik merges)", watcher: read-only, data_keeper: dry-run only }
